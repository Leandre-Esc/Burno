name: Windows

# Builds the installer, tests the installed app on a real Windows machine,
# and publishes a GitHub Release when a version tag (v1.2.3) is pushed.
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Build the installer
        run: npx tauri build --bundles nsis

      - name: Install it like a user would
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          "SETUP=$($setup.FullName)" >> $env:GITHUB_ENV
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $app = Get-ChildItem "$env:LOCALAPPDATA\Burno" -Recurse -Filter *.exe | Where-Object Name -NotMatch 'uninstall' | Select-Object -First 1
          if (-not $app) { throw "Burno.exe not found after install" }
          "APP=$($app.FullName)" >> $env:GITHUB_ENV

      - name: Launch the installed app and capture the window
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e-screenshots | Out-Null
          $p = Start-Process -FilePath $env:APP -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "Burno exited with code $($p.ExitCode)" }
          if (-not (Test-Path "$env:APPDATA\com.burno.app\collections\My Collection\burno.json")) { throw "Default collection not created" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("e2e-screenshots/desktop.png")
          Stop-Process -Id $p.Id
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

      # Tauri's own WebView2 arguments win over environment variables, so opening
      # the debugging port takes a copy built with that one setting added.
      - name: Build a test copy with the debugging port open
        run: npx tauri build --no-bundle --config scripts/tauri.e2e.conf.json

      - name: Test the app
        env:
          APP: ${{ github.workspace }}\src-tauri\target\release\burno.exe
        run: node scripts/windows-e2e.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results
          path: |
            e2e-screenshots/
            src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:SETUP" --title "Burno ${{ github.ref_name }}" --notes-file .github/release/notes.md
